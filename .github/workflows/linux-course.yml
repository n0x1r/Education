name: Linux course checks
on:
  push:
    paths: ['linux/**', '.github/workflows/linux-course.yml']
  pull_request:
    paths: ['linux/**', '.github/workflows/linux-course.yml']
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify course, simulator, persistence, HTTP and real practice pack
        working-directory: linux
        run: python -m unittest discover -s tests -v
